<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordini fornitori locali</title>
<style>
/* colori del tabulato fornitori locali (Paola 20/11/2026) */
:root{--rosso:#c8102e;--blu:#1d3557;--ink:#18202e;--muted:#5b6577;--linea:#d4dae5;--sfondo:#eef1f6;--carta:#fff;--ord:#dde5f2;--reso:#fbe6d8;--reso-head:#8a3b12;--verde:#25D366;--gas:#d9a400;--gas-bg:#fff4c7;--pane:#d9488f;--pane-bg:#fde1ee;--pls:#2b6fe0;--pls-bg:#dfeaff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--sfondo);color:var(--ink);font-size:15px}
header{background:var(--blu);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.5px}
.logo b{color:#2b2b2b;background:#fff;padding:0 2px 0 4px;border-radius:3px 0 0 3px}
.logo i{font-style:normal;color:#fff;background:var(--rosso);padding:0 4px 0 2px;border-radius:0 3px 3px 0}
header h1{font-size:15px;margin:0;font-weight:600;flex:1;line-height:1.2}
header h1 small{display:block;font-weight:400;opacity:.75;font-size:12px}
main{padding:12px;max-width:900px;margin:0 auto}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--linea)}
.btn.rosso{background:var(--rosso);color:#fff;border-color:var(--rosso)}
.btn.verde{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.scuro{background:var(--blu);color:#fff;border-color:var(--blu)}
.griglia{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}   /* negozi 4 e 4 (Paola 20/11/2026) */
@media (max-width:520px){.griglia{grid-template-columns:repeat(2,1fr)}}
.griglia .btn{padding:16px 10px;font-size:16px;text-align:center}
.griglia .btn.tot{background:var(--blu);color:#fff;grid-column:1/-1}
.riga{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
label.data{font-weight:600}
input[type=date],input[type=search]{font-size:16px;padding:9px 10px;border:1px solid var(--linea);border-radius:10px;background:#fff}
input[type=search]{flex:1;min-width:0}
.forn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px;padding:13px 14px}
.forn small{color:var(--muted);font-weight:400}
.forn .cnt{background:var(--rosso);color:#fff;border-radius:12px;padding:2px 9px;font-size:12px;white-space:nowrap}
h2{font-size:18px;margin:6px 0}
.sub{color:var(--muted);font-size:13px}
.art{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.art .d{flex:1;min-width:0}
.art .d b{display:block;font-size:14px}
.art .d span{font-size:11px;color:var(--muted)}
.rep{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:4px}
.rep.GASTRO{background:var(--gas-bg);border:1px solid var(--gas)}.rep.PANE{background:var(--pane-bg);border:1px solid var(--pane)}.rep.PLS{background:var(--pls-bg);border:1px solid var(--pls)}
.art{border-left:6px solid var(--linea)}.art.GASTRO{border-left-color:var(--gas)}.art.PANE{border-left-color:var(--pane)}.art.PLS{border-left-color:var(--pls)}
.q{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:2px}
.q input{width:58px;font-size:17px;padding:7px 4px;text-align:center;border:1px solid var(--linea);border-radius:8px}
.q.o input{background:var(--ord)}.q.r input{background:var(--reso)}
.q input:not(:placeholder-shown){font-weight:700;border-color:#b45309}
.barra{position:sticky;bottom:0;background:var(--sfondo);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--linea)}
.barra .btn{flex:1;min-width:130px}
.filtri{display:flex;gap:6px;flex-wrap:wrap}
.filtri button{border:1px solid var(--linea);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.filtri button[aria-pressed=true]{background:var(--blu);color:#fff}
.wrap{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid var(--linea)}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{border:1px solid var(--linea);padding:4px;text-align:center;white-space:nowrap}
th{background:var(--blu);color:#fff;font-size:11px;position:sticky;top:0}
td.d{text-align:left;white-space:normal;min-width:170px;position:sticky;left:0;background:#fff;z-index:1}
th.d{position:sticky;left:0;z-index:2}
td input{width:42px;font-size:15px;padding:4px 2px;text-align:center;border:1px solid var(--linea);border-radius:6px}
td.r input{background:var(--reso)}td.o input{background:var(--ord)}
td.no{background:#e3e3e3}
td.tot{font-weight:700;background:#e2efda}td.totr{font-weight:700;background:var(--reso)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:18px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--blu);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
[hidden]{display:none!important}
</style></head><body>

       +'<div class="q r">RESO<input inputmode="decimal" placeholder=" " data-k="'+i+'|r" value="'+esc(v[i+'|r']||'')+'"></div></div>'});
  }else{
    var P=DATI.pdv, has=P.map(function(p){return p.f.indexOf(S.forn)>=0});
    t+='<div class="wrap"><table><tr><th class="d" rowspan="2">ARTICOLO</th>'+P.map(function(p){return '<th colspan="2">'+esc(p.n.split(' ')[0].slice(0,8))+'</th>'}).join('')+'<th rowspan="2">TOT<br>ORD</th><th rowspan="2">TOT<br>RESO</th></tr><tr>'
      +P.map(function(){return '<th>ORD</th><th>RESO</th>'}).join('')+'</tr>';
    f.a.forEach(function(a,i){ if(S.rep!=='*'&&a[4]!==S.rep) return;
      t+='<tr><td class="d"><b>'+esc(a[3])+'</b><br><span class="sub">'+esc(a[0])+(a[1]?' · '+esc(a[1]):'')+'</span> <span class="rep '+a[4]+'">'+a[4]+'</span></td>';
      P.forEach(function(p,j){['o','r'].forEach(function(x){ var kk=i+'|'+j+'|'+x;
        t+=has[j]?'<td class="'+x+'"><input inputmode="decimal" placeholder=" " data-k="'+kk+'" value="'+esc(v[kk]||'')+'"></td>':'<td class="no"></td>'})});
      t+='<td class="tot" id="to'+i+'"></td><td class="totr" id="tr'+i+'"></td></tr>'});
    t+='</table></div>';
  }
  t+='<div class="barra"><button class="btn verde" id="foto">Invia foto</button><button class="btn scuro" id="mail">Mail</button><button class="btn" id="wa">Testo</button><button class="btn" id="svuota">Svuota</button></div>';
  $('m').innerHTML=t; window.scrollTo(0,0);
  $('m').querySelectorAll('.filtri button').forEach(function(b){b.onclick=function(){S.rep=b.dataset.r;fornitore()}});
  $('m').querySelectorAll('input[data-k]').forEach(function(inp){inp.oninput=function(){var o=ld(k),x=inp.value.trim().replace('.',',');if(x)o[inp.dataset.k]=x;else delete o[inp.dataset.k];sv(k,o);if(tot)totali()}});
  if(tot) totali();
  $('foto').onclick=inviaFoto;
  $('wa').onclick=function(){var x=testo();if(!x)return toast('Nessuna quantità inserita.');location.href='https://wa.me/?text='+encodeURIComponent(x)};
  $('mail').onclick=function(){var x=testo();if(!x)return toast('Nessuna quantità inserita.');location.href='mailto:?subject='+encodeURIComponent('ORDINE '+nomePdv()+' del '+it(S.data)+' - '+f.n)+'&body='+encodeURIComponent(x.replace(/\*/g,''))};
  $('svuota').onclick=function(){if(confirm('Cancellare le quantità di questo ordine?')){sv(k,{});fornitore()}};
}
/* ---------- foto dell'ordine: tabella disegnata su canvas, condivisa come immagine ---------- */
function righeFoto(){
  var f=DATI.forn[S.forn],v=ld(chiave()),out=[],cols=[];
  if(S.pdv!=='T'){f.a.forEach(function(a,i){var o=v[i+'|o']||'',r=v[i+'|r']||'';if(o||r)out.push({a:a,c:[[o,r]]})});cols=['ORD/RESO']}
  else{
    var usati=DATI.pdv.map(function(p,j){return f.a.some(function(a,i){return v[i+'|'+j+'|o']||v[i+'|'+j+'|r']})});
    DATI.pdv.forEach(function(p,j){if(usati[j])cols.push(p.n)});
    f.a.forEach(function(a,i){var c=[],any=false;DATI.pdv.forEach(function(p,j){if(!usati[j])return;var o=v[i+'|'+j+'|o']||'',r=v[i+'|'+j+'|r']||'';if(o||r)any=true;c.push([o,r])});if(any)out.push({a:a,c:c})});
  }
  return {f:f,righe:out,cols:cols};
}
function taglia(ctx,t,w){if(ctx.measureText(t).width<=w)return t;while(t.length>1&&ctx.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function disegnaFoto(){
  var R=righeFoto(); if(!R.righe.length) return null;
  var tot=S.pdv==='T', nc=tot?R.cols.length:1;
  var X={cod:20,d:170,rep:620}, wcol=tot?150:220, W=Math.max(1080,X.rep+90+(tot?wcol*(nc+1):wcol*2)+20);
  var RH=46, top=230, H=top+RH*(R.righe.length+1)+120;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H; var c=cv.getContext('2d');
  c.fillStyle='#eef1f6'; c.fillRect(0,0,W,H);
  c.fillStyle='#1d3557'; c.fillRect(0,0,W,120);
  c.font='bold 40px Georgia,serif'; c.fillStyle='#fff'; c.fillRect(20,32,78,52); c.fillStyle='#2b2b2b'; c.fillText('Hol',26,72);
  c.fillStyle='#c8102e'; c.fillRect(98,32,96,52); c.fillStyle='#fff'; c.fillText('dem',102,72);
  c.font='bold 30px Arial'; c.fillText('ORDINE '+nomePdv(),220,62); c.font='22px Arial'; c.fillText('Ordine del '+giorno(S.data)+' '+it(S.data),220,95);
  c.fillStyle='#18202e'; c.font='bold 32px Arial'; c.fillText(taglia(c,R.f.n,W-40),20,170);
  c.font='18px Arial'; c.fillStyle='#5b6577'; c.fillText(R.righe.length+(R.righe.length===1?' articolo':' articoli')+' · ORD = ordine, R = reso',20,202);
  var y=top; c.fillStyle='#1d3557'; c.fillRect(0,y,W,RH); c.fillStyle='#fff'; c.font='bold 18px Arial';
  c.fillText('COD. FORN.',X.cod,y+29); c.fillText('DESCRIZIONE',X.d,y+29); c.fillText('REP.',X.rep,y+29);
  var x0=X.rep+90;
  if(!tot){c.fillText('ORD',x0+20,y+29);c.fillText('RESO',x0+wcol+20,y+29)}
  else{R.cols.forEach(function(n,k){c.fillText(taglia(c,n,wcol-10),x0+k*wcol+8,y+29)});c.fillText('TOTALE',x0+nc*wcol+8,y+29)}
  var colRep={GASTRO:['#fff4c7','#d9a400'],PANE:['#fde1ee','#d9488f'],PLS:['#dfeaff','#2b6fe0']};
  R.righe.forEach(function(r,i){y+=RH; var a=r.a;
    c.fillStyle=i%2?'#f7f9fc':'#ffffff'; c.fillRect(0,y,W,RH); c.fillStyle='#d4dae5'; c.fillRect(0,y+RH-1,W,1);
    var cr=colRep[a[4]]||['#eee','#999']; c.fillStyle=cr[1]; c.fillRect(0,y,8,RH);
    c.fillStyle='#18202e'; c.font='bold 19px Arial'; c.fillText(taglia(c,a[1]||a[0],X.d-X.cod-10),X.cod,y+30);
    c.font='19px Arial'; c.fillText(taglia(c,a[3],X.rep-X.d-12),X.d,y+30);
    c.fillStyle=cr[0]; c.fillRect(X.rep-4,y+9,80,28); c.fillStyle='#18202e'; c.font='bold 15px Arial'; c.fillText(a[4],X.rep+2,y+29);
    if(!tot){
      c.fillStyle='#dde5f2'; c.fillRect(x0,y+5,wcol-10,RH-10); c.fillStyle='#fbe6d8'; c.fillRect(x0+wcol,y+5,wcol-10,RH-10);
      c.fillStyle='#18202e'; c.font='bold 24px Arial'; c.fillText(r.c[0][0],x0+20,y+32); c.fillStyle='#8a3b12'; c.fillText(r.c[0][1],x0+wcol+20,y+32);
    }else{
      var so=0,sr=0;
      r.c.forEach(function(q,k){so+=num(q[0]);sr+=num(q[1]);var xx=x0+k*wcol;
        if(q[0]){c.fillStyle='#18202e';c.font='bold 22px Arial';c.fillText(q[0],xx+8,y+31)}
        if(q[1]){c.fillStyle='#8a3b12';c.font='bold 17px Arial';c.fillText('R '+q[1],xx+70,y+31)}});
      var xt=x0+nc*wcol; c.fillStyle='#e2efda'; c.fillRect(xt,y+5,wcol-10,RH-10);
      c.fillStyle='#18202e'; c.font='bold 22px Arial'; c.fillText(fmt(so),xt+8,y+31); if(sr){c.fillStyle='#8a3b12';c.font='bold 17px Arial';c.fillText('R '+fmt(sr),xt+70,y+31)}
    }
  });
  c.fillStyle='#5b6577'; c.font='16px Arial'; c.fillText('Creato dal Business Controller · Holdem',20,H-30);
  return cv;
}
function nomeFile(){return ('ORDINE '+nomePdv()+' '+DATI.forn[S.forn].n+' '+it(S.data).replace(/\//g,'-')).replace(/[^\w \-]/g,'').replace(/\s+/g,' ')+'.png'}
function blobDa(cv){var u=cv.toDataURL('image/png'),b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/png'})}
function scaricaFoto(b,n){var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Immagine salvata: allegala su WhatsApp dalla galleria.')}
function inviaFoto(){
  var cv=disegnaFoto(); if(!cv) return toast('Nessuna quantità inserita.');
  var b=blobDa(cv), n=nomeFile(), file=null;
  try{file=new File([b],n,{type:'image/png'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Ordine '+DATI.forn[S.forn].n}).catch(function(e){if(!e||e.name!=='AbortError')scaricaFoto(b,n)});
  }else scaricaFoto(b,n);
}
function num(x){var n=parseFloat(String(x||'').replace(',','.'));return isNaN(n)?0:n}
function fmt(n){return n?String(Math.round(n*100)/100).replace('.',','):''}
function totali(){var f=DATI.forn[S.forn],v=ld(chiave());f.a.forEach(function(a,i){var o=0,r=0;DATI.pdv.forEach(function(p,j){o+=num(v[i+'|'+j+'|o']);r+=num(v[i+'|'+j+'|r'])});
  var a1=$('to'+i),a2=$('tr'+i);if(a1)a1.textContent=fmt(o);if(a2)a2.textContent=fmt(r)})}
function riga(a,q){return q+' x '+a[3]+' (cod. '+(a[1]||a[0])+(a[2]?(a[2].length>=8?' EAN ':' PLU ')+a[2]:'')+')'}
function testo(){
  var f=DATI.forn[S.forn],v=ld(chiave()),o=[],r=[];
  if(S.pdv!=='T'){f.a.forEach(function(a,i){if(v[i+'|o'])o.push(riga(a,v[i+'|o']));if(v[i+'|r'])r.push(riga(a,v[i+'|r']))})}
  else{DATI.pdv.forEach(function(p,j){var oo=[],rr=[];f.a.forEach(function(a,i){if(v[i+'|'+j+'|o'])oo.push(riga(a,v[i+'|'+j+'|o']));if(v[i+'|'+j+'|r'])rr.push(riga(a,v[i+'|'+j+'|r']))});
    if(oo.length)o.push('_'+p.n+'_\n'+oo.join('\n'));if(rr.length)r.push('_'+p.n+'_\n'+rr.join('\n'))})}
  if(!o.length&&!r.length) return null;
  var t='*ORDINE '+nomePdv()+'*\nOrdine del '+giorno(S.data)+' '+it(S.data)+'\nFornitore: '+f.n;
  if(o.length) t+='\n\n*ORDINE*\n'+o.join('\n');
  if(r.length) t+='\n\n*RESO*\n'+r.join('\n');
  return t+'\n\nGrazie';
}
disegna();
